services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: issueagent
      POSTGRES_PASSWORD: issueagent
      POSTGRES_DB: issueagent
    ports:
      - "5432:5432"
    volumes:
      - issueagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issueagent -d issueagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://issueagent:issueagent@postgres:5432/issueagent
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      TEST_COMMAND: ${TEST_COMMAND:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_ORIGIN: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  issueagent_pgdata:
  frontend_node_modules:
